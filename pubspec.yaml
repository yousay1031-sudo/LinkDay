name: linkday_app
description: "LinkDay - 放課後等デイサービス運営支援システム"
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: 6.1.5+1

  # Local Storage
  hive: 2.2.3
  hive_flutter: 1.1.0
  shared_preferences: 2.5.3

  # Firebase
  firebase_core: 3.6.0
  cloud_firestore: 5.4.3
  firebase_auth: 5.3.0
  # Day 11: LINE 空き枠通知（Callable Function 呼び出し）
  cloud_functions: 5.1.3

  # Maps & Location
  google_maps_flutter: 2.9.0
  google_maps_flutter_web: 0.5.10
  flutter_polyline_points: 2.1.0

  # PDF & Excel
  pdf: 3.11.1
  printing: 5.13.4
  excel: 4.0.6
  csv: 6.0.0
  charset: 2.0.1

  # File & Network
  file_picker: 8.1.4
  http: 1.5.0
  url_launcher: 6.3.0
  web: ^1.1.0

  # Localization
  # 日付・時刻の選択画面などの標準部品を日本語にする（flutter_localizations）。
  # flutter_localizations（Flutter 3.50 同梱）が intl ^0.20.3 を求めるため 0.19.0 から上げた。
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3

  # UUID generation
  uuid: 4.5.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Hive code generation
  hive_generator: 2.0.1
  build_runner: 2.4.13
  # Firestore 移行: テストで使うメモリ上の偽 Firestore（エミュレータ不要）
  fake_cloud_firestore: 3.1.0

flutter:
  uses-material-design: true
