name: linkday_app
description: "LinkDay - 放課後等デイサービス運営支援システム"
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: 6.1.5+1

  # Local Storage
  hive: 2.2.3
  hive_flutter: 1.1.0
  shared_preferences: 2.5.3

  # Firebase (接続は次回プロンプト)
  firebase_core: 3.6.0
  cloud_firestore: 5.4.3
  firebase_auth: 5.3.0

  # Maps & Location
  google_maps_flutter: 2.9.0
  google_maps_flutter_web: 0.5.10
  flutter_polyline_points: 2.1.0

  # PDF & Excel
  pdf: 3.11.1
  printing: 5.13.4
  excel: 2.1.0

  # File & Network
  file_picker: 8.1.4
  http: 1.5.0
  url_launcher: 6.3.0

  # Localization
  intl: 0.19.0

  # UUID generation
  uuid: 4.5.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Hive code generation
  hive_generator: 2.0.1
  build_runner: 2.4.13

flutter:
  uses-material-design: true
