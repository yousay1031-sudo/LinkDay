<!DOCTYPE html>
<html>
<head>
  <!--

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LinkDay - 放課後等デイサービス管理システム">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LinkDay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LinkDay</title>
  <link rel="manifest" href="manifest.json">

  <!--
    ═══════════════════════════════════════════════════════════════════
    Google Maps JavaScript API 動的ロード
    ───────────────────────────────────────────────────────────────────
    APIキーはビルド時に --dart-define=GOOGLE_MAPS_API_KEY=xxx で渡すか、
    SharedPreferences から読み出した後に Flutter 側から
    window.loadGoogleMaps(key) を呼び出す。
    ═══════════════════════════════════════════════════════════════════
  -->
  <script>
    // ─── Google Maps JavaScript API 動的ロード（Promise版）────────
    // Flutter dart:js_interop から呼び出す。
    // APIキーは SharedPreferences から読み出した後に Flutter 側が渡す。
    // loadGoogleMaps(apiKey) → Promise<void>
    window.loadGoogleMaps = function(apiKey) {
      return new Promise(function(resolve, reject) {
        // キー未設定チェック
        if (!apiKey || apiKey === '' || apiKey === '<<GOOGLE_MAPS_API_KEY>>') {
          reject(new Error('Google Maps API キーが設定されていません'));
          return;
        }
        // 既にロード済み（同じキー）
        if (window.google && window.google.maps) {
          resolve();
          return;
        }
        // 既にロード中（別の Promise が進行中）
        if (window._googleMapsLoading) {
          window._googleMapsLoadCallbacks = window._googleMapsLoadCallbacks || [];
          window._googleMapsLoadCallbacks.push({ resolve: resolve, reject: reject });
          return;
        }
        window._googleMapsLoading = true;
        window._googleMapsLoadCallbacks = [{ resolve: resolve, reject: reject }];

        var script = document.createElement('script');
        script.src = 'https://maps.googleapis.com/maps/api/js'
          + '?key=' + encodeURIComponent(apiKey)
          + '&libraries=geometry,places'
          + '&language=ja'
          + '&region=JP'
          + '&callback=__googleMapsReady';
        script.async = true;
        script.defer = true;
        script.onerror = function(e) {
          window._googleMapsLoading = false;
          var cbs = window._googleMapsLoadCallbacks || [];
          window._googleMapsLoadCallbacks = [];
          cbs.forEach(function(cb) { cb.reject(new Error('Google Maps スクリプトのロードに失敗しました')); });
        };
        document.head.appendChild(script);
      });
    };

    // Callback: Google Maps API 読み込み完了
    window.__googleMapsReady = function() {
      window._googleMapsLoading = false;
      var cbs = window._googleMapsLoadCallbacks || [];
      window._googleMapsLoadCallbacks = [];
      cbs.forEach(function(cb) { cb.resolve(); });
      // Flutter 側にも CustomEvent で通知
      window.dispatchEvent(new CustomEvent('googleMapsReady'));
    };

    // ─── JS Interop: Geocoder ────────────────────────────────────
    // geocodeAddress(address) → Promise<{lat, lng}>
    window.geocodeAddress = function(address) {
      return new Promise(function(resolve, reject) {
        if (!window.google || !window.google.maps) {
          reject(new Error('Google Maps がまだロードされていません'));
          return;
        }
        var geocoder = new google.maps.Geocoder();
        geocoder.geocode(
          { address: address, region: 'JP' },
          function(results, status) {
            if (status === 'OK' && results && results.length > 0) {
              var loc = results[0].geometry.location;
              resolve({ lat: loc.lat(), lng: loc.lng() });
            } else if (status === 'ZERO_RESULTS') {
              reject(new Error('ZERO_RESULTS: 住所が見つかりませんでした: ' + address));
            } else {
              reject(new Error('Geocoder エラー: ' + status));
            }
          }
        );
      });
    };

    // ─── JS Interop: Routes API (google.maps.routes.Route.computeRoutes) ──
    //
    // 【移行履歴】
    //   2026-02: google.maps.DirectionsService が deprecated
    //   2026-06: Routes API (google.maps.routes.Route.computeRoutes) に移行完了
    //   移行ガイド: https://developers.google.com/maps/documentation/javascript/routes/routes-js-migration
    //   Routes API リファレンス: https://developers.google.com/maps/documentation/javascript/reference/route
    //
    // getDirectionsRoundTrip(requestJson) → Promise<resultJson>
    // requestJson: { facilityLat, facilityLng, waypointLatLngs: [{lat,lng},...], optimize }
    //
    // レスポンス構造:
    //   totalDistanceMeters: number          合計距離 [m]
    //   totalDurationSeconds: number         合計時間 [s]（route.durationMillis / 1000）
    //   polylinePoints: [{lat, lng}, ...]    ルートポリライン座標列（Route.path より）
    //   optimizedOrder: number[]             optimize=true 時の waypoint 順序（0始まり）
    //   legs: [{ distanceMeters, durationSeconds }, ...]  各区間
    //
    // Google Cloud Console での Routes API 有効化手順（未有効化の場合）:
    //   1. https://console.cloud.google.com/apis/library にアクセス
    //   2. "Routes API" を検索して「有効にする」をクリック
    //   ※ Maps JavaScript API と同じプロジェクト・APIキーで利用可能
    window.getDirectionsRoundTrip = function(requestJson) {
      return new Promise(function(resolve, reject) {
        if (!window.google || !window.google.maps) {
          reject(new Error('Google Maps がまだロードされていません'));
          return;
        }

        var req;
        try {
          req = JSON.parse(requestJson);
        } catch (parseErr) {
          reject(new Error('リクエストJSONのパースに失敗: ' + parseErr));
          return;
        }

        var facilityLat     = req.facilityLat;
        var facilityLng     = req.facilityLng;
        var waypointLatLngs = req.waypointLatLngs || [];
        var optimize        = req.optimize === true;

        // ── デバッグログ: Routes API リクエスト ──
        console.log('[Routes API] request:'
          + ' facility=' + facilityLat + ',' + facilityLng
          + ', stops=' + waypointLatLngs.length
          + ', optimize=' + optimize);

        // ── Routes API ライブラリを動的ロード ──
        // importLibrary("routes") で google.maps.routes.Route を取得する
        google.maps.importLibrary('routes').then(function(routesLib) {
          var Route = routesLib.Route;

          // ── fields: 必要なフィールドのみ要求（パフォーマンス最適化）──
          var fields = [
            'distanceMeters',
            'durationMillis',
            'legs.distanceMeters',
            'legs.durationMillis',
            'path'
          ];
          // optimize=true のとき optimizedIntermediateWaypointIndices も取得
          if (optimize) {
            fields.push('optimizedIntermediateWaypointIndices');
          }

          // ── intermediates: 利用者宅の中間 waypoint ──
          // 注意: intermediates の型は Iterable<Waypoint> であるため、
          // { location: LatLngLiteral } 形式の Waypoint として指定する。
          // { lat, lng } の LatLngLiteral を直接渡すと型エラーになる。
          // Waypoint 仕様: https://developers.google.com/maps/documentation/javascript/reference/route#Waypoint
          var intermediates = waypointLatLngs.map(function(wp) {
            return { location: { lat: wp.lat, lng: wp.lng } };
          });

          // ── ComputeRoutesRequest 構築 ──
          var computeRequest = {
            origin:               { lat: facilityLat, lng: facilityLng },
            destination:          { lat: facilityLat, lng: facilityLng },
            intermediates:        intermediates,
            travelMode:           'DRIVING',
            routingPreference:    'TRAFFIC_AWARE',
            optimizeWaypointOrder: optimize,
            language:             'ja',
            region:               'JP',
            units:                'METRIC',
            fields:               fields
          };

          return Route.computeRoutes(computeRequest);

        }).then(function(response) {
          // ── レスポンス検証 ──
          if (!response || !response.routes || response.routes.length === 0) {
            console.warn('[Routes API] no routes returned');
            reject(new Error('Routes API: ルートが返されませんでした'));
            return;
          }

          var route = response.routes[0];

          // ── 合計距離・時間（null 安全）──
          var totalDistanceMeters  = (route.distanceMeters != null) ? route.distanceMeters : 0;
          var totalDurationSeconds = (route.durationMillis != null)
            ? Math.floor(route.durationMillis / 1000) : 0;

          // ── legs: 各区間の距離・時間（null 安全）──
          var legs = (Array.isArray(route.legs) ? route.legs : []).map(function(leg) {
            return {
              distanceMeters:  (leg.distanceMeters != null) ? leg.distanceMeters : 0,
              durationSeconds: (leg.durationMillis != null) ? Math.floor(leg.durationMillis / 1000) : 0
            };
          });

          // ── optimizedOrder: optimize=false のとき []、undefined 対策 ──
          var optimizedOrder = [];
          if (optimize && Array.isArray(route.optimizedIntermediateWaypointIndices)) {
            optimizedOrder = route.optimizedIntermediateWaypointIndices;
          }

          // ── polylinePoints: Route.path（LatLngAltitude配列）→ {lat,lng} 配列 ──
          // LatLngAltitude の .lat / .lng は readonly number プロパティ
          // （旧 LatLng とは異なりメソッドではない）
          // ただし、一部のブラウザ環境では関数として返る可能性があるため両方に対応。
          var polylinePoints = [];
          if (Array.isArray(route.path)) {
            route.path.forEach(function(pt) {
              if (!pt) return; // null/undefined 対策
              var lat = (typeof pt.lat === 'function') ? pt.lat() : pt.lat;
              var lng = (typeof pt.lng === 'function') ? pt.lng() : pt.lng;
              // lat/lng が有効な数値であることを確認
              if (lat != null && lng != null && isFinite(lat) && isFinite(lng)) {
                polylinePoints.push({ lat: lat, lng: lng });
              }
            });
          }

          // ── デバッグログ: Routes API レスポンス ──
          console.log('[Routes API] response:'
            + ' legs=' + legs.length
            + ', totalDist=' + totalDistanceMeters + 'm'
            + ', totalDur=' + totalDurationSeconds + 's'
            + ', optimizedOrder=[' + optimizedOrder.join(',') + ']'
            + ', pathPoints=' + polylinePoints.length);

          resolve(JSON.stringify({
            totalDistanceMeters:  totalDistanceMeters,
            totalDurationSeconds: totalDurationSeconds,
            polylinePoints:       polylinePoints,
            optimizedOrder:       optimizedOrder,
            legs:                 legs
          }));

        }).catch(function(err) {
          // ── Routes API 呼び出しエラー ──
          var msg = (err && err.message) ? err.message : String(err);
          console.warn('[Routes API] failed:', msg);
          reject(new Error('Routes API failed: ' + msg));
        });
      });
    };
  </script>

  <!--
    ═══════════════════════════════════════════════════════════════════
    Service Worker 自動更新・キャッシュ制御スクリプト
    ───────────────────────────────────────────────────────────────────
    問題:  Flutter Web の Service Worker はアグレッシブにキャッシュするため、
           再ビルド後も古いバージョンが使われ続けることがある。
    対策1: controllerchange イベントで新SW検出時に自動リロード
    対策2: 既存 SW の待機中バージョンを即時 activate させる
    対策3: 古い SW を全 unregister してフレッシュスタートを促す
    ═══════════════════════════════════════════════════════════════════
  -->
  <script>
    (function () {
      'use strict';

      // ── 無限リロード防止フラグ ──────────────────────────────────
      // sessionStorage はタブを閉じると消えるため、
      // 1セッション内での過剰リロードを防ぐ
      var RELOAD_FLAG_KEY = 'ld_sw_reloading';

      if (!('serviceWorker' in navigator)) {
        // Service Worker 非対応環境（古いブラウザ等）はそのまま続行
        return;
      }

      // ── 1. controller 交代（新SW が制御権を取得）したら自動リロード ──
      // これが最も重要: 新ビルドの SW が activate されたタイミングで
      // ページを再読み込みし、確実に最新 JS を使わせる
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (sessionStorage.getItem(RELOAD_FLAG_KEY)) {
          // すでにこのセッションでリロード済み → 無限ループ防止
          return;
        }
        sessionStorage.setItem(RELOAD_FLAG_KEY, '1');
        window.location.reload();
      });

      // ── 2. 登録済み SW の skipWaiting を促す ──────────────────────
      // waiting 状態（インストール済みだが activate 待ち）の SW に
      // SKIP_WAITING メッセージを送り、即時 activate させる
      navigator.serviceWorker.ready.then(function (registration) {
        if (registration.waiting) {
          registration.waiting.postMessage({ type: 'SKIP_WAITING' });
        }

        // updatefound: 新しい SW のインストールが始まったら
        registration.addEventListener('updatefound', function () {
          var newWorker = registration.installing;
          if (!newWorker) return;

          newWorker.addEventListener('statechange', function () {
            // installed = インストール完了（waiting 状態）
            if (newWorker.state === 'installed' &&
                navigator.serviceWorker.controller) {
              // waiting SW に skipWaiting を要求
              newWorker.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        });
      });

      // ── 3. 開発時ヘルパー: 古い SW の自動クリーンアップ ────────────
      // URL に ?nocache=1 を付けるとすべての SW を unregister して
      // フレッシュな状態に戻せる（開発者向け緊急手段）
      if (window.location.search.indexOf('nocache=1') !== -1) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          var promises = registrations.map(function (r) { return r.unregister(); });
          Promise.all(promises).then(function () {
            // クエリパラメータを消してからリロード
            var url = window.location.href.replace(/[?&]nocache=1/, '');
            window.location.replace(url);
          });
        });
      }
    })();
  </script>
</head>
<body>
  <!--
    ═══════════════════════════════════════════════════════════════════
    キャッシュバスティング: flutter_bootstrap.js にタイムスタンプを付与
    ───────────────────────────────────────────────────────────────────
    <script src="flutter_bootstrap.js" async> の代わりに
    JS で動的に script タグを生成してタイムスタンプクエリを付与する。
    これにより、再ビルドのたびにブラウザが必ずサーバーから
    最新の flutter_bootstrap.js を取得する。
    ═══════════════════════════════════════════════════════════════════
  -->
  <script>
    (function () {
      var script = document.createElement('script');
      // タイムスタンプ: ビルドごとに変わる → ブラウザキャッシュをバイパス
      // 注意: flutter_bootstrap.js 自体は小さいファイルなので
      //       毎回取得してもパフォーマンス影響は軽微
      script.src = 'flutter_bootstrap.js?v=' + new Date().getTime();
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
